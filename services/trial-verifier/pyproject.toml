[project]
name = "platform-evm-trial-verifier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "eth-account>=0.13,<0.14", "pydantic-settings>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
